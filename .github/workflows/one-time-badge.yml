name: Apply RxNXT badge styling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-badge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update badge
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_css = '''    .hero-badge {\n      display: inline-flex;'''
          new_css = '''    .hero-badge {\n      display: inline-flex;'''
          if old_css not in s:
              raise SystemExit('hero-badge CSS anchor not found')
          if '.hero-ai-letter' not in s:
              css = '''\n    .hero-ai-letter {\n      position: relative;\n      display: inline-block;\n    }\n\n    .hero-ai-sparkle {\n      position: absolute;\n      left: 50%;\n      top: -0.72em;\n      transform: translateX(-50%);\n      font-size: 0.55em;\n      line-height: 1;\n      color: #fbbf24;\n      text-shadow: 0 0 8px rgba(251, 191, 36, 0.55);\n      pointer-events: none;\n    }\n'''
              s = s.replace(old_css, new_css + css, 1)
          old_badge = '<span>🩺 Doctor First. AI enabled</span>'
          new_badge = '<span>🩺 Doctor First. A<span class="hero-ai-letter"><span class="hero-ai-sparkle">✦</span>I</span> Enabled</span>'
          if old_badge not in s:
              raise SystemExit('hero badge text not found')
          s = s.replace(old_badge, new_badge, 1)
          s = s.replace('<strong>Doctor First. AI enabled.</strong>', '<strong>Doctor First. AI Enabled.</strong>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-badge.yml
          git add index.html
          git commit -m "Refine Doctor First AI badge"
          git push
