name: Fix treatment highlight

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch treatment highlight
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'Make it the beginning of <span>treatment.</span>'
          new = 'Make it the beginning of <span class="heroHighlight">treatment.</span>'
          if old not in s:
              raise SystemExit('Expected hero markup not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Highlight treatment in hero headline'
          git push
