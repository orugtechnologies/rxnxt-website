name: Set hero headline colors

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch hero headline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_markup = 'end of the <span class="heroHighlight">consultation.</span><strong class="heroSub">Make it the beginning of <span class="heroHighlight">treatment.</span></strong>'
          new_markup = 'end of the consultation.<strong class="heroSub">Make it the beginning of treatment</strong>'
          if old_markup not in s:
              raise SystemExit('Expected hero markup not found')
          s = s.replace(old_markup, new_markup, 1)
          old_css = '.heroSub{display:block;font-size:1em;line-height:1.08;color:var(--ink);margin-top:18px;letter-spacing:-.04em}'
          new_css = '.heroSub{display:block;font-size:1em;line-height:1.08;color:var(--green);margin-top:18px;letter-spacing:-.04em}'
          if old_css not in s:
              raise SystemExit('Expected heroSub CSS not found')
          s = s.replace(old_css, new_css, 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Set hero headline colors'
          git push
