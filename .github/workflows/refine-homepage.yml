name: Refine RxNXT homepage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: contains(github.event.head_commit.message, 'Refine RxNXT homepage')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine homepage messaging
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old = '''<p class="heroLead">Make it the beginning of treatment. RxNXT helps doctors carry the treatment journey beyond the consultation—with digital prescriptions, medication reminders, follow-up and patient engagement.</p><div class="actions">'''
          new = '''<p class="heroLead">Make it the beginning of treatment. RxNXT helps doctors carry the treatment journey beyond the consultation—with digital prescriptions, medication reminders, follow-up and patient engagement.</p><div class="heroNext"><span>↓</span><strong>See what happens after the consultation</strong><small>Scroll to follow the treatment journey</small></div><div class="actions">'''
          if old in s:
              s = s.replace(old, new, 1)

          old_css = '''.heroLead{font-size:18px;color:var(--muted);max-width:650px;margin:24px 0 28px}.actions{display:flex;gap:11px;flex-wrap:wrap}'''
          new_css = '''.heroLead{font-size:18px;color:var(--muted);max-width:650px;margin:24px 0 18px}.heroNext{display:flex;align-items:center;gap:10px;margin:0 0 25px;color:#536862}.heroNext span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#dff3e9;color:var(--green);font-weight:800}.heroNext strong{font-size:12px;color:var(--ink)}.heroNext small{font-size:10px;color:var(--muted)}.actions{display:flex;gap:11px;flex-wrap:wrap}'''
          if old_css in s:
              s = s.replace(old_css, new_css, 1)

          old_section = '''<section class="section question" id="why"><div class="wrap"><div class="intro"><div class="kicker">The moment after prescribing</div><h2>The consultation ends. The treatment doesn't.</h2><p>A prescription creates the plan. What happens after the patient leaves the clinic is where treatment has to continue.</p></div>'''
          new_section = '''<section class="section question" id="why"><div class="wrap"><div class="intro"><div class="kicker">What happens next?</div><h2>The consultation ends. The treatment doesn't.</h2><p>A prescription creates the plan. But once the patient leaves the clinic, the treatment journey has only just begun.</p></div>'''
          if old_section in s:
              s = s.replace(old_section, new_section, 1)

          p.write_text(s)
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refine-homepage.yml
          git commit -m "Refine RxNXT homepage messaging" || exit 0
          git push
          git rm .github/workflows/refine-homepage.yml
          git commit -m "Remove one-time homepage refinement workflow"
          git push
