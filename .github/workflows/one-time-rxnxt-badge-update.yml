name: One-time RxNXT badge update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-badge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update badge text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'DOCTOR LED. AI ENABLED'
          new = 'Doctor First. AI enabled'
          if old not in s:
              raise SystemExit('Expected badge text was not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-rxnxt-badge-update.yml
          git add index.html
          git commit -m "Update RxNXT positioning to Doctor First"
          git push
